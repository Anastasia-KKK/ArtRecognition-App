<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Заявки</title>

<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: #f4f6f8;
  display: flex;
}

/* SIDEBAR */
.sidebar {
  width: 200px;
  background: white;
  border-right: 1px solid #eee;
  padding: 20px;
  display: flex;
  flex-direction: column;

  height: 95vh;
  position: fixed;
  left: 0;
  top: 0;
}

.logo {
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 30px;
  color: #2b2b2b;
}

.nav-item {
  padding: 12px;
  border-radius: 10px;
  margin-bottom: 8px;
  cursor: pointer;
  color: #555;
  transition: 0.2s;
}

.nav-item:hover {
  background: #f2f2f2;
}

.active {
  background: #f4c542;
  color: black;
}

/* USER */
.user {
  margin-top: auto;
  display: flex;
  align-items: center;
  gap: 10px;
}

.avatar {
  width: 70px;
  height: 70px;
  border-radius: 50%;
  background: url('avatar.jpg') center/cover;
}

/* MAIN */
.main {
  flex: 1;
  padding: 40px;
  margin-left: 230px;
}

/* HEADER */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 25px;
}

.title {
  font-size: 26px;
  font-weight: 600;
}

.add-btn {
  background: #f4c542;
  padding: 10px 18px;
  border-radius: 10px;
  cursor: pointer;
  font-weight: 500;
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
}

/* CARD */
.card {
  background: white;
  border-radius: 16px;
  padding: 16px;
  box-shadow: 0 6px 15px rgba(0,0,0,0.05);
}

.image {
  width: 100%;
  aspect-ratio: 1 / 1;
  border-radius: 12px;
  background-size: cover;
  background-position: center;
  margin-bottom: 12px;
}

.name {
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 6px;
}

/* STATUS */
.status {
  display: inline-block;
  padding: 4px 10px;
  border-radius: 8px;
  font-size: 12px;
  margin-bottom: 10px;
}

.pending { background: #eee; }
.revision { background: #ffe0a3; }
.approved { background: #cde8d4; }
.rejected { background: #f5c6c6; }

/* COMMENT */
.comment {
  font-size: 13px;
  color: #666;
  margin-bottom: 10px;
}

/* BUTTONS */
.actions {
  display: flex;
  gap: 10px;
}

.btn {
  flex: 1;
  padding: 8px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
}

.view {
  background: #f1f1f1;
}

.edit {
  background: #f4c542;
}

.user-block {
  margin-top: auto;
}

.user {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}

.logout {
  padding: 10px;
  border-radius: 8px;
  cursor: pointer;
  color: #777;
  font-size: 14px;
  transition: 0.2s;
}

.logout:hover {
  background: #f2f2f2;
  color: black;
}

</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="logo">ArtPanel</div>

  <div class="nav-item active">Заявки</div>
  <div class="nav-item">Мои картины</div>
  <div class="nav-item">Профиль</div>

  <div class="user">
    <div class="avatar"></div>
    <div>Сергей Брюханов</div>
  </div>

  <div class="logout">Выйти</div>
</div>

<!-- MAIN -->
<div class="main">

  <div class="header">
    <div class="title">Заявки</div>
    <div class="add-btn">+ Добавить картину</div>
  </div>

  <div class="grid">

    <div class="card">
      <div class="image" style="background-image:url('u1.jpg');"></div>
      <div class="name">Пейзаж 7</div>
      <div class="status pending">На модерации</div>
      <div class="actions">
        <button class="btn view">Посмотреть</button>
      </div>
    </div>

    <div class="card">
      <div class="image" style="background-image:url('u2.jpg');"></div>
      <div class="name">Игра с черным ангелом 2</div>
      <div class="status revision">Требует доработки</div>
      <div class="comment">Добавьте описание картины</div>
      <div class="actions">
        <button class="btn view">Посмотреть</button>
        <button class="btn edit">Редактировать</button>
      </div>
    </div>

    <div class="card">
      <div class="image" style="background-image:url('u3.jpg');"></div>
      <div class="name">Игра с черным ангелом 2</div>
      <div class="status approved">Одобрено</div>
      <div class="actions">
        <button class="btn view">Посмотреть</button>
      </div>
    </div>

  </div>

</div>

</body>
</html>
