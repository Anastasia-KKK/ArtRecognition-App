<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Панель модератора</title>
  <link rel="stylesheet" href="styles/style.css">
</head>
<body class="dashboard-dark">

  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="avatar"></div>
      <div class="moderator-info">
        <h3>Модератор</h3>
      </div>
    </div>

    <nav class="sidebar-nav">
      <button class="side-btn active" data-section="artworks">Картины</button>
      <button class="side-btn" data-section="authors">Авторы</button>
      <button class="side-btn" data-section="authors">Заявки</button>
      <button class="side-btn logout-btn">Выйти</button>
    </nav>
  </aside>

  <main class="dashboard-content">
  
    <section id="artworks" class="section active">
      <div class="section-header">
        <h2>Картины</h2>
       <a href="add-artwork.html" class="add-btn">+ Добавить картину</a>
      </div>
      <div id="artworksList" class="cards-container"></div>
    </section>

    <section id="authors" class="section">
      <div class="section-header">
        <h2>Авторы</h2>
        <a href="add-author.html" class="add-btn">+ Добавить автора</a>
      </div>
      <div id="authorsList" class="cards-container"></div>
    </section>
  </main>

  <script src="scripts/dashboard.js"></script>
</body>
</html>
